services:
  - type: web
    name: vfstr-interview-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: ENVIRONMENT
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: vfstr_interview
      - key: INTERVIEW_DB_NAME
        value: interview_db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOW_MOCK_EVALUATOR_FALLBACK
        value: "false"
      - key: DEMO_MODE
        value: "false"
      - key: ENABLE_BOOTSTRAP_ENDPOINT
        value: "false"
      - key: ALLOW_BOOTSTRAP_IN_PRODUCTION
        value: "false"
